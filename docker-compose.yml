# Log Doctor - 장애 분석 대상 3-Tier 환경 (1주차)
# Nginx(Web) → FastAPI(WAS) → PostgreSQL(DB)
# 로그는 ./logs 아래에 파일로 남겨, 2주차부터 Agent가 읽는다.

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ld-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 공식 이미지는 로그를 stdout으로 보내는 심볼릭 링크를 쓰는데,
      # 디렉터리를 마운트하면 링크가 가려져 실제 파일로 기록된다.
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: ./app
    container_name: ld-app
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-shop}
      DB_USER: ${POSTGRES_USER:-shop}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      LOG_FILE: /app/logs/app.log
    volumes:
      - ./logs/app:/app/logs
    healthcheck:
      # WAS가 요청을 받을 준비가 됐는지 확인 (recover 시 --wait가 이 결과를 기다림)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: "no" # 장애 시연을 위해 자동 재시작하지 않음

  db:
    image: postgres:16-alpine
    container_name: ld-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"

volumes:
  db-data:
